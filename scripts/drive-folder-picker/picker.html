<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>완성본 폴더 최초 연결</title>
<style>body{font:18px system-ui;max-width:700px;margin:60px auto;padding:24px;line-height:1.7}button{font:inherit;padding:12px 24px;cursor:pointer}#status{white-space:pre-wrap}</style>
<h1>완성본 폴더 최초 연결</h1><p>Google 선택 창에서 <b>Tictoc</b> 폴더를 선택하세요. 이 과정은 앱에 해당 폴더 접근을 허용합니다. 파일 업로드는 하지 않습니다.</p><button id="choose" disabled>폴더 선택</button><p id="status">Google 선택 창을 준비하고 있습니다…</p>
<script>
let cfg,ready=false;
const status=document.getElementById('status'),btn=document.getElementById('choose');
async function selected(data){
 if(data.action!==google.picker.Action.PICKED)return;
 const folder=data.docs[0];btn.disabled=true;status.textContent='선택한 폴더와 쓰기 권한을 확인 중입니다…';
 try{const r=await fetch('selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:folder.id})});const d=await r.json();if(!r.ok)throw new Error(d.message||'폴더 확인 실패');status.textContent='연결 완료: '+d.name+'\n실행 창에 안내된 새 드라이브 토큰을 클라우드 시크릿에 등록해 주세요. 이 창은 닫아도 됩니다.';}catch(e){status.textContent=e.message;btn.disabled=false;}
}
function choose(){
 if(!ready)return;
 const view=new google.picker.DocsView(google.picker.ViewId.FOLDERS).setIncludeFolders(true).setSelectFolderEnabled(true).setMimeTypes('application/vnd.google-apps.folder');
 new google.picker.PickerBuilder().setAppId(cfg.appId).setDeveloperKey(cfg.apiKey).setOAuthToken(cfg.token).setOrigin(location.origin).setTitle('완성본 저장 폴더 Tictoc 선택').addView(view).setCallback(selected).build().setVisible(true);
}
function loaded(){gapi.load('picker',{callback:async()=>{try{const r=await fetch('config',{cache:'no-store'});if(!r.ok)throw new Error();cfg=await r.json();ready=true;btn.disabled=false;status.textContent='아래 폴더 선택 버튼을 누르고 Tictoc 폴더를 선택하세요.';}catch(e){status.textContent='실행 창이 닫혔거나 연결이 만료됐습니다. 프로그램을 다시 실행하세요.';}},onerror:()=>{status.textContent='Google Picker 로딩 실패. Picker API 활성화와 네트워크를 확인하세요.';}});}
btn.onclick=()=>{try{choose();}catch(e){status.textContent='선택 창을 열지 못했습니다. 같은 프로젝트의 API 키·프로젝트 번호와 Picker API 활성화를 확인하세요.';}};
</script><script src="https://apis.google.com/js/api.js?onload=loaded" onerror="document.getElementById('status').textContent='Google 스크립트를 불러오지 못했습니다. 브라우저 확장 기능과 인터넷 연결을 확인하세요.'"></script></html>
